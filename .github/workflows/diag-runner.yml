name: Diag Runner Health

on:
  workflow_dispatch:

jobs:
  idle:
    name: idle-45min
    runs-on: ubuntu-22.04
    timeout-minutes: 70
    steps:
      - name: 纯空转 45 分钟，不做任何工作
        run: |
          for i in $(seq 1 90); do
            sleep 30
            echo "heartbeat $i  t=$((i*30))s  $(date -u +%H:%M:%S)"
          done
          echo "RESULT=SURVIVED_IDLE"

  network:
    name: network-45min
    runs-on: ubuntu-22.04
    timeout-minutes: 70
    steps:
      - name: 45 分钟周期性网络请求
        run: |
          for i in $(seq 1 90); do
            sleep 30
            C=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 https://github.com || echo ERR)
            echo "beat $i  t=$((i*30))s  github=$C  $(date -u +%H:%M:%S)"
          done
          echo "RESULT=SURVIVED_NETWORK"

  diskio:
    name: diskio-45min
    runs-on: ubuntu-22.04
    timeout-minutes: 70
    steps:
      - name: 45 分钟周期性磁盘读写
        run: |
          mkdir -p /tmp/io
          for i in $(seq 1 90); do
            dd if=/dev/zero of=/tmp/io/f bs=1M count=512 oflag=direct 2>/dev/null || dd if=/dev/zero of=/tmp/io/f bs=1M count=512 2>/dev/null
            sync; rm -f /tmp/io/f
            sleep 25
            echo "beat $i  t=$((i*30))s  $(df -h / | tail -1)  $(date -u +%H:%M:%S)"
          done
          echo "RESULT=SURVIVED_DISKIO"
