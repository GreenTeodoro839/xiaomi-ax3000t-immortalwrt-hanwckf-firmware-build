name: Diag CPU Saturation

on:
  workflow_dispatch:

jobs:
  stress:
    name: ${{ matrix.arm }}
    runs-on: ubuntu-22.04
    timeout-minutes: 70
    strategy:
      fail-fast: false
      matrix:
        include:
          - arm: full-nproc-nice0      # 等价于 make -j$(nproc)，当前构建的做法
            procs: "0"
            nice: "0"
          - arm: full-nproc-nice19     # 等价于 nice -n 19 make -j$(nproc)
            procs: "0"
            nice: "19"
          - arm: nproc-minus1-nice0    # 等价于 make -j3，给 agent 留一核
            procs: "-1"
            nice: "0"

    steps:
      - name: 45 分钟 CPU 压测
        run: |
          N=$(nproc)
          case "${{ matrix.procs }}" in
            "-1") N=$((N-1)) ;;
          esac
          echo "nproc=$(nproc)  压测进程数=$N  nice=${{ matrix.nice }}"

          for i in $(seq 1 $N); do
            nice -n ${{ matrix.nice }} sha256sum /dev/zero &
          done

          for i in $(seq 1 90); do
            sleep 30
            echo "beat $i  t=$((i*30))s  load=$(cut -d' ' -f1-3 /proc/loadavg)  $(date -u +%H:%M:%S)"
          done

          pkill -f 'sha256sum /dev/zero' || true
          echo "RESULT=SURVIVED  arm=${{ matrix.arm }}"
