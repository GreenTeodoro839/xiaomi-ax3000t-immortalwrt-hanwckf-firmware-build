name: Diag FDS

on:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/hanwckf/immortalwrt-mt798x.git
  REPO_BRANCH: openwrt-21.02
  TZ: Asia/Shanghai

jobs:
  diag:
    name: fds-${{ matrix.fds }}
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        fds: [ "on", "off" ]

    steps:
      - name: Baseline disk
        run: df -hT / /mnt || true

      - name: Free disk space (Ubuntu)
        if: matrix.fds == 'on'
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: false

      - name: Disk after FDS
        run: df -hT / /mnt || true

      - name: Checkout
        uses: actions/checkout@main

      - name: Full pipeline under watchdog
        env:
          DEBIAN_FRONTEND: noninteractive
          NEEDRESTART_MODE: a
          NEEDRESTART_SUSPEND: 1
        run: |
          # 看门狗：整条流水线放同一步，输出才能持续落到日志里
          (
            for i in $(seq 1 170); do
              sleep 30
              echo "##### WD t=$((i*30))s  fds=${{ matrix.fds }} #####"
              ps -eo pid,etimes,stat,wchan:20,cmd --sort=-etimes | head -12
              df -h / | tail -1
              free -m | head -2
            done
          ) &
          WD=$!

          set -x
          sudo apt-get -qq update
          sudo -E apt-get -qq install --no-install-recommends ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
          bzip2 ccache clang clangd cmake cpio curl device-tree-compiler ecj fastjar flex gawk gettext gcc-multilib \
          g++-multilib git gperf haveged help2man intltool lib32gcc-s1 libc6-dev-i386 libelf-dev libglib2.0-dev \
          libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5 libncursesw5-dev libreadline-dev \
          libssl-dev libtool lld lldb lrzsz mkisofs msmtp nano ninja-build p7zip p7zip-full patch pkgconf python2.7 \
          python3 python3-pip python3-ply python3-docutils qemu-utils re2c rsync scons squashfs-tools subversion swig \
          texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev
          sudo timedatectl set-timezone "$TZ"
          sudo mkdir -p /srcdir
          sudo chown $USER:$GROUPS /srcdir

          cd /srcdir
          git clone $REPO_URL -b $REPO_BRANCH openwrt
          cd openwrt

          chmod +x $GITHUB_WORKSPACE/before-update-custom.sh $GITHUB_WORKSPACE/after-update-custom.sh
          $GITHUB_WORKSPACE/before-update-custom.sh
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          cp -f $GITHUB_WORKSPACE/.config .config
          $GITHUB_WORKSPACE/after-update-custom.sh

          sed -i 's/curl -f --connect-timeout 20 --retry 5/curl -f --connect-timeout 20 --speed-limit 1024 --speed-time 120 --max-time 1800 --retry 5/' scripts/download.pl
          make defconfig

          ok=0
          for i in 1 2 3; do
            echo "==== download 第 $i 轮 ===="
            if timeout 900 make download -j8; then ok=1; break; fi
          done
          echo "DOWNLOAD_OK=$ok"

          kill $WD 2>/dev/null || true
          df -hT /
          du -sh dl 2>/dev/null || true

      - name: Post-mortem
        if: always()
        run: |
          df -hT /
          sudo dmesg 2>/dev/null | grep -iE 'oom|killed process|out of memory|I/O error' | tail -20 || echo "(clean)"
